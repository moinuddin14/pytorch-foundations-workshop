<header class="site-header">
  <div class="container header-inner">
    {{- $logo := resources.Get "images/aiyatra-logo.png" -}}
    {{- $brandLogo := $logo.Resize "112x112 webp q88" -}}
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="AI Yatra PyTorch Foundations home">
      <img class="brand-logo" src="{{ $brandLogo.RelPermalink }}" width="56" height="56" alt="" aria-hidden="true">
      <span class="brand-copy">
        <span class="brand-title">PyTorch Foundations</span>
        <span class="brand-credit">An AI Yatra workshop</span>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation" data-site-nav>
      {{ range site.Menus.main }}
        <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="github-link" href="{{ site.Params.githubRepo }}" rel="external">GitHub ↗</a>
      <a class="linkedin-link" href="{{ site.Params.linkedin }}" rel="external">LinkedIn ↗</a>
    </nav>
  </div>
</header>
