{{ if not .IsHome }}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="{{ site.Home.RelPermalink }}">Home</a>
  {{ with .CurrentSection }}{{ if not .IsHome }}<span>/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
  {{ if not .IsSection }}<span>/</span><span aria-current="page">{{ .Title }}</span>{{ end }}
</nav>
{{ end }}
