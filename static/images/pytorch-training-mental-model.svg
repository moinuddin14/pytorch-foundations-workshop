<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1260" viewBox="0 0 1080 1260" role="img" aria-labelledby="title description">
  <title id="title">How PyTorch learns in one training step</title>
  <desc id="description">A five-step diagram showing the forward pass, loss calculation, gradient reset, autograd backward pass, and optimizer weight update. Updated weights loop back into the model for the next step.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101426" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#25304f"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6656d9"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ee4c2c"/>
    </marker>
    <marker id="arrowLoop" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#ee4c2c"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .step { font-size: 19px; font-weight: 800; letter-spacing: 1.7px; }
      .heading { font-size: 28px; font-weight: 800; fill: #171923; }
      .body { font-size: 20px; fill: #596174; }
      .code { font-size: 22px; font-weight: 700; fill: #171923; }
      .box-label { font-size: 16px; font-weight: 800; letter-spacing: 1.2px; fill: #66708a; }
      .box-value { font-size: 22px; font-weight: 750; fill: #171923; }
    </style>
  </defs>

  <rect width="1080" height="1260" rx="32" fill="#f7f5ef"/>
  <path d="M32 0 H1048 Q1080 0 1080 32 V132 H0 V32 Q0 0 32 0 Z" fill="#101426"/>
  <circle cx="61" cy="52" r="19" fill="#ee4c2c"/>
  <path d="M56 42c8 3 13 10 13 18 0 7-4 13-10 16 4-4 6-9 4-14-2-6-7-9-13-9z" fill="#fff" opacity=".95"/>
  <text class="sans" x="95" y="58" font-size="34" font-weight="850" fill="#fff">How PyTorch learns</text>
  <text class="sans" x="95" y="94" font-size="20" fill="#c9cde2">One training step · read from top to bottom</text>

  <g transform="translate(54 154)">
    <circle cx="8" cy="8" r="8" fill="#4353ff"/>
    <text class="sans" x="25" y="14" font-size="17" font-weight="700" fill="#596174">Forward: values move toward the loss</text>
    <circle cx="355" cy="8" r="8" fill="#6656d9"/>
    <text class="sans" x="372" y="14" font-size="17" font-weight="700" fill="#596174">Backward: gradients move toward weights</text>
    <circle cx="786" cy="8" r="8" fill="#ee4c2c"/>
    <text class="sans" x="803" y="14" font-size="17" font-weight="700" fill="#596174">Update: weights change</text>
  </g>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="198" width="1000" height="212" rx="24" fill="#eef1ff" stroke="#bdc5ff" stroke-width="2"/>
  </g>
  <circle cx="82" cy="238" r="23" fill="#4353ff"/>
  <text class="sans" x="82" y="246" text-anchor="middle" font-size="23" font-weight="850" fill="#fff">1</text>
  <text class="sans step" x="120" y="245" fill="#4353ff">FORWARD · MAKE A PREDICTION</text>
  <text class="sans body" x="120" y="276">The model combines the input with its current trainable weights.</text>

  <rect x="88" y="309" width="178" height="70" rx="14" fill="#fff" stroke="#cfd5ee" stroke-width="2"/>
  <text class="sans box-label" x="177" y="333" text-anchor="middle">INPUT BATCH</text>
  <text class="mono box-value" x="177" y="361" text-anchor="middle">x</text>

  <path d="M278 344 H374" fill="none" stroke="#25304f" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <rect x="390" y="299" width="254" height="90" rx="16" fill="#fff" stroke="#4353ff" stroke-width="3"/>
  <text class="sans box-label" x="517" y="326" text-anchor="middle">MODEL</text>
  <text class="mono box-value" x="517" y="356" text-anchor="middle">model(x)</text>
  <text class="sans" x="517" y="379" text-anchor="middle" font-size="16" font-weight="700" fill="#4353ff">contains weights</text>

  <path d="M658 344 H746" fill="none" stroke="#25304f" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <rect x="762" y="309" width="208" height="70" rx="14" fill="#fff" stroke="#cfd5ee" stroke-width="2"/>
  <text class="sans box-label" x="866" y="333" text-anchor="middle">PREDICTION</text>
  <text class="mono box-value" x="866" y="361" text-anchor="middle">pred</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="40" y="436" width="1000" height="168" rx="24" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  </g>
  <circle cx="82" cy="476" r="23" fill="#4353ff"/>
  <text class="sans" x="82" y="484" text-anchor="middle" font-size="23" font-weight="850" fill="#fff">2</text>
  <text class="sans step" x="120" y="483" fill="#4353ff">LOSS · MEASURE THE ERROR</text>

  <rect x="89" y="518" width="165" height="54" rx="27" fill="#eef1ff" stroke="#bdc5ff"/>
  <text class="mono" x="171" y="551" text-anchor="middle" font-size="20" font-weight="700" fill="#25304f">pred</text>
  <text class="sans" x="285" y="552" text-anchor="middle" font-size="22" font-weight="800" fill="#8a90a0">+</text>
  <rect x="315" y="518" width="165" height="54" rx="27" fill="#fff7e8" stroke="#f4c468"/>
  <text class="mono" x="397" y="551" text-anchor="middle" font-size="20" font-weight="700" fill="#77540c">target y</text>
  <path d="M500 545 H590" fill="none" stroke="#25304f" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <rect x="606" y="506" width="354" height="78" rx="15" fill="#101426"/>
  <text class="mono" x="783" y="538" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">loss_fn(pred, y)</text>
  <text class="sans" x="783" y="566" text-anchor="middle" font-size="17" fill="#c9cde2">one number: how wrong?</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="40" y="630" width="1000" height="136" rx="24" fill="#f4f2ff" stroke="#cfc8ff" stroke-width="2"/>
  </g>
  <circle cx="82" cy="670" r="23" fill="#6656d9"/>
  <text class="sans" x="82" y="678" text-anchor="middle" font-size="23" font-weight="850" fill="#fff">3</text>
  <text class="sans step" x="120" y="677" fill="#6656d9">CLEAR OLD GRADIENTS</text>
  <rect x="120" y="701" width="385" height="43" rx="11" fill="#fff" stroke="#cfc8ff"/>
  <text class="mono code" x="312" y="730" text-anchor="middle">optimizer.zero_grad()</text>
  <text class="sans body" x="536" y="728">Gradients add up unless you reset them.</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="40" y="792" width="1000" height="202" rx="24" fill="#f4f2ff" stroke="#cfc8ff" stroke-width="2"/>
  </g>
  <circle cx="82" cy="832" r="23" fill="#6656d9"/>
  <text class="sans" x="82" y="840" text-anchor="middle" font-size="23" font-weight="850" fill="#fff">4</text>
  <text class="sans step" x="120" y="839" fill="#6656d9">BACKWARD · CALCULATE RESPONSIBILITY</text>
  <text class="sans body" x="120" y="870">Autograd follows the recorded math backward and fills each parameter's <tspan class="mono" font-weight="700">.grad</tspan>.</text>

  <rect x="84" y="906" width="238" height="58" rx="13" fill="#fff" stroke="#cfc8ff" stroke-width="2"/>
  <text class="mono code" x="203" y="942" text-anchor="middle">loss.backward()</text>
  <path d="M338 935 H423" fill="none" stroke="#6656d9" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <rect x="439" y="906" width="196" height="58" rx="13" fill="#6656d9"/>
  <text class="sans" x="537" y="942" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">AUTOGRAD</text>
  <path d="M651 935 H736" fill="none" stroke="#6656d9" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <rect x="752" y="906" width="226" height="58" rx="13" fill="#fff" stroke="#cfc8ff" stroke-width="2"/>
  <text class="mono code" x="865" y="942" text-anchor="middle">parameter.grad</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="40" y="1020" width="1000" height="166" rx="24" fill="#fff0eb" stroke="#f3b5a7" stroke-width="2"/>
  </g>
  <circle cx="82" cy="1060" r="23" fill="#ee4c2c"/>
  <text class="sans" x="82" y="1068" text-anchor="middle" font-size="23" font-weight="850" fill="#fff">5</text>
  <text class="sans step" x="120" y="1067" fill="#d33a1e">UPDATE · IMPROVE THE WEIGHTS</text>

  <rect x="95" y="1100" width="286" height="58" rx="13" fill="#fff" stroke="#f3b5a7" stroke-width="2"/>
  <text class="mono code" x="238" y="1136" text-anchor="middle">optimizer.step()</text>
  <path d="M397 1129 H483" fill="none" stroke="#ee4c2c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <rect x="499" y="1095" width="352" height="68" rx="14" fill="#ee4c2c"/>
  <text class="sans" x="675" y="1124" text-anchor="middle" font-size="18" font-weight="750" fill="#ffe2dc">SGD EXAMPLE</text>
  <text class="mono" x="675" y="1150" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">weight -= lr * weight.grad</text>

  <!-- Feedback loop -->
  <path d="M868 1129 H1014 V400 H517 V389" fill="none" stroke="#ee4c2c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLoop)"/>
  <rect x="879" y="392" width="134" height="62" rx="12" fill="#fff0eb" stroke="#f3b5a7"/>
  <text class="sans" x="946" y="416" text-anchor="middle" font-size="14" font-weight="850" letter-spacing="1" fill="#d33a1e">NEXT STEP</text>
  <text class="sans" x="946" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#8d2f1c">updated weights</text>

  <!-- Footer -->
  <rect x="40" y="1210" width="1000" height="35" rx="17" fill="#101426"/>
  <text class="sans" x="540" y="1234" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">
    TRAINING uses all 5 steps · INFERENCE stops after the prediction
  </text>
</svg>
